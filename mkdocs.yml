site_name: Go Starter Kit
site_description: Un outil CLI puissant pour generer des projets Go prets pour la production
site_author: tky0065
site_url: https://tky0065.github.io/go-starter-kit/

repo_name: tky0065/go-starter-kit
repo_url: https://github.com/tky0065/go-starter-kit

theme:
  name: material
  language: fr
  custom_dir: docs/overrides
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Passer au mode sombre
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Passer au mode clair
  features:
    - navigation.sections
    - navigation.top
    - navigation.indexes
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy
  icon:
    repo: fontawesome/brands/github

plugins:
  - search:
      lang: fr

nav:
  # Getting Started
  - Accueil: index.md
  - Installation: installation.md
  - Quick Start: quick-start.md
  - Utilisation: usage.md

  # Databases
  - Bases de données:
      - Guide de sélection: databases.md
      - Guide de migration: database-migration.md

  # Tutorial
  - Tutorial:
      - tutorial/index.md
      - Partie 1 - Installation: tutorial/01-setup.md
      - Partie 2 - Premier domaine: tutorial/02-first-domain.md
      - Partie 3 - API HTTP: tutorial/03-api-integration.md
      - Partie 4 - Tests & Deploy: tutorial/04-testing-deployment.md

  # Complete Guide
  - Guide complet:
      - guide/index.md
      - Architecture: guide/architecture.md
      - Structure du projet: guide/structure.md
      - Configuration: guide/configuration.md
      - Développement: guide/development.md
      - Exemples pratiques: guide/examples.md
      - API Reference: guide/api-reference.md
      - Tests: guide/testing.md
      - Base de données: guide/database.md
      - Sécurité: guide/security.md
      - Déploiement: guide/deployment.md
      - Monitoring: guide/monitoring.md
      - Bonnes pratiques: guide/best-practices.md

  # Reference
  - Référence:
      - Glossaire: reference/glossary.md
      - FAQ: reference/faq.md

  # Development
  - Développement:
      - Architecture CLI: cli-architecture.md
      - Contribuer: contributing.md

markdown_extensions:
  - admonition
  - codehilite
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - tables
  - toc:
      permalink: true

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/tky0065/go-starter-kit
  alternate:
    - name: Français
      link: /go-starter-kit/
      lang: fr
    - name: English
      link: /go-starter-kit/en/
      lang: en

extra_css:
  - stylesheets/extra.css

copyright: Copyright &copy; 2026 tky0065
